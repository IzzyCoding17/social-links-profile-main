<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      *{
        margin: 0;
        padding: 0;

      }

      body {
        background-color: hsl(0, 0%, 8%);
        font-family: "Roboto";
      }

      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
      }
      .container ul {
        width: 100%;
        list-style: none;
        display: flex;
        align-items: center;
        /* align-items: center;*/
        flex-direction: column;
        gap: 10px;
        padding-left: 0;
      }
      .card h2 {
        color: #fff;
      }
      .card h5{
        color:  hsl(75, 94%, 57%);
        margin-bottom: 24px;
      }
      .card p{
        color: #fff;
        margin-bottom: 20px;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 300px;
        padding: 20px;
        border-radius: 10px;
        background-color: hsl(0, 0%, 12%);
      }

      .card a {
        text-decoration: none;
        color: white;
        transition: .2s ease-in-out;
      }
      
      .card img {
        width: 80px;
        border-radius: 50%;
        margin-bottom: 12px;
      }
      
      .card li{
        width: 50%;
        text-align: center;
        border-radius: 10px;
        background-color:  hsl(0, 0%, 20%);
        padding: 17px 50px;
        transition: .2s ease-in-out;
      }
      
      .card li:hover{
        background-color: hsl(75, 94%, 57%);
      }

      .card li:hover a{
        color: hsl(0, 0%, 8%);
      }
      footer{
        color: #fff;
      }

      footer a{
        text-decoration: none;
        color: greenyellow;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img
          src="./social-links-profile-main/assets/images/avatar-jessica.jpeg"
          alt="Jessica Randall"
        />
        <h2>Jessica Randall</h2>
        <h5>London, United Kingdom</h5>
        <p>"Front-end developer and avid reader."</p>
        <ul>
          <li><a href="">GitHub</a></li>
          <li><a href="">LinkedIn</a></li>
          <li><a href="">Twitter</a></li>
          <li><a href="">Instagram</a></li>
          <li><a href="">YouTube</a></li>
        </ul>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Israel Davies</a>.
    </footer>
  </body>
</html>
